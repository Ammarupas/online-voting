<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online Voting System</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    nav a {
      text-decoration: none;
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #0056b3;
    }

    header {
      text-align: center;
      padding: 20px 0;
    }

    main {
      text-align: center;
      margin-top: 40px;
      font-size: 1.1rem;
    }

    .logo {
      display: block;
      margin: 0 auto 20px;
      width: 100px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Optional logo (can be added later) -->
    <img src="/images/logo.png" alt="Voting Logo" class="logo" />

    <header>
      <h1>🗳️ Welcome to the Online Voting System</h1>
      <p>Your voice matters. Make it count!</p>
    </header>

    <nav>
      <ul>
        <li><a href="/register.html">📝 Register</a></li>
        <li><a href="/login.html">🔐 Login</a></li>
        <li><a href="/vote.html">🗳️ Vote</a></li>
        <li><a href="/results.html">📊 Results</a></li>
      </ul>
    </nav>

    <main>
      <p>This portal allows citizens to register, log in, cast their votes, and view real-time election results. Start by registering or logging in.</p>
    </main>

  </div>
</body>
</html>
